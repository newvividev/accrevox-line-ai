services:
  db:
    image: postgres:16-alpine
    container_name: accrevox-line-db
    environment:
      POSTGRES_DB: accrevox_line_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accrevox_line_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: accrevox-line-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/accrevox_line_mvp?schema=public
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      ACCREVOX_BASE_URL: ${ACCREVOX_BASE_URL}
      ACCREVOX_CLIENT_ID: ${ACCREVOX_CLIENT_ID}
      ACCREVOX_CLIENT_SECRET: ${ACCREVOX_CLIENT_SECRET}
      ACCREVOX_COMPANY_API_KEY: ${ACCREVOX_COMPANY_API_KEY}
      DEFAULT_BRANCH_CODE: ${DEFAULT_BRANCH_CODE:-00000}
      DEFAULT_VAT_METHOD: ${DEFAULT_VAT_METHOD:-PER_ITEM}
      DEFAULT_PRICE_METHOD: ${DEFAULT_PRICE_METHOD:-INCLUSIVE}
      DEFAULT_APPROVAL_PERSON: ${DEFAULT_APPROVAL_PERSON:-}
      DEFAULT_CREATED_PERSON: ${DEFAULT_CREATED_PERSON:-}
      BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-demo}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Demo Company}
      BOOTSTRAP_PACKAGE_PLAN: ${BOOTSTRAP_PACKAGE_PLAN:-core}
      BOOTSTRAP_AI_MODE: ${BOOTSTRAP_AI_MODE:-credit}
      BOOTSTRAP_AI_ADDON_ENABLED: ${BOOTSTRAP_AI_ADDON_ENABLED:-true}
      BOOTSTRAP_AI_CREDIT_BALANCE: ${BOOTSTRAP_AI_CREDIT_BALANCE:-1000}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
